<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --mute:#8f8f8f;
    --hairline:#e6e6e6;
    --nav-h:64px;
    --footer-h:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter','Zen Kaku Gothic New', sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  body.no-scroll{ overflow:hidden; height:100vh; }
  ::selection{background:var(--ink); color:var(--paper);}
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- NAV ---------- */
  header{
    position:fixed; top:0; left:0; right:0; height:var(--nav-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px;
    z-index:200;
    mix-blend-mode:difference;
  }
  header, header a{ color:#fff; }
  .logo{
    font-family:'Inter','Zen Kaku Gothic New', sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-decoration:none;
    font-weight:500;
    cursor:pointer;
    text-transform:uppercase;
    transition:opacity .3s ease;
    min-width:10px;
  }
  nav ul{
    list-style:none;
    display:flex;
    gap:32px;
  }
  nav a{
    text-decoration:none;
    color:#fff;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    opacity:0.65;
    transition:opacity .3s ease;
  }
  nav a::after{
    content:'';
    position:absolute; left:0; bottom:0;
    width:0; height:1px;
    background:#fff;
    transition:width .35s ease;
  }
  nav a:hover{ opacity:1; }
  nav a.current{ opacity:1; }
  nav a.current::after{ width:100%; }

  .menu-toggle{
    display:none;
    background:none; border:none; color:#fff;
    font-size:20px; line-height:1; cursor:pointer;
    padding:4px;
  }

  /* ---------- SHARED PAGE HEADING ---------- */
  .page-heading{
    font-size:26px;
    font-weight:500;
    letter-spacing:0.03em;
    margin-bottom:56px;
  }

  /* ---------- PAGE SWITCHING ---------- */
  .page{
    display:none;
    min-height:100vh;
  }
  .page.active{
    display:block;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- HOME (no scroll, fits viewport with footer) ---------- */
  #page-home{
    height:calc(100vh - var(--footer-h));
    min-height:auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
  }
  .hero-stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hero-bg-img{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    max-width:min(750px, 70vw);
    max-height:55vh;
    width:auto; height:auto;
    cursor:pointer;
    filter:grayscale(15%) contrast(1.02);
    transition:opacity .25s ease;
    z-index:1;
  }
  .hero-bg-img.fading{ opacity:0; }
  #page-home h1{
    position:relative;
    z-index:2;
    background:var(--paper);
    padding:14px 36px;
    font-weight:500;
    font-size:clamp(20px, 4vw, 48px);
    letter-spacing:0.1em;
  }

  /* ---------- PORTFOLIO (password gate + scrollable viewer) ---------- */
  #page-portfolio{
    height:100vh;
    position:relative;
  }
  #portfolio-lock{
    height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    gap:18px;
    padding:0 24px;
  }
  .lock-label{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--mute);
  }
  .lock-input{
    border:none; border-bottom:1px solid var(--ink); background:none;
    text-align:center; font-size:14px; padding:8px 4px; width:200px;
    font-family:inherit; letter-spacing:0.05em; color:var(--ink);
  }
  .lock-input:focus{ outline:none; border-bottom-color:var(--mute); }
  .lock-btn{
    background:none; border:1px solid var(--ink); padding:10px 30px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .lock-btn:hover{ background:var(--ink); color:#fff; }
  .lock-error{ font-size:11px; color:#b23b3b; min-height:14px; }

  #portfolio-viewer{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:250;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #portfolio-viewer.active{ display:block; }
  #pv-pages{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:80px 0 60px;
  }
  #pv-pages canvas{
    display:block;
    width:100%;
    max-width:1000px;
    height:auto;
    margin-bottom:2px;
  }
  .pv-loading{
    color:rgba(255,255,255,0.6);
    font-size:11px;
    letter-spacing:0.1em;
    text-align:center;
    padding-top:120px;
  }
  .pv-close{
    position:fixed; top:20px; right:24px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(255,255,255,0.7);
    cursor:pointer;
    z-index:260;
  }
  .pv-close:hover{ color:#fff; }

  /* ---------- WORKS ---------- */
  .works-wrap{
    padding:calc(var(--nav-h) + 64px) 8vw 160px;
    max-width:1100px;
    margin:0 auto;
  }
  .works-wrap .page-heading{ margin-bottom:80px; }
  .works-list{
    display:flex;
    flex-direction:column;
    gap:80px;
  }
  .work-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    cursor:pointer;
  }
  .work-item img{
    display:block;
    width:38%;
    min-width:220px;
    max-width:460px;
    height:auto;
    filter:grayscale(100%) contrast(1.02);
    transition:filter .6s ease, opacity .6s ease, transform .5s ease;
  }
  .work-item:hover img{
    filter:grayscale(0%) contrast(1.02);
    transform:translateY(-2px);
  }

  /* ---------- ABOUT ---------- */
  #page-about .inner{
    padding:calc(var(--nav-h) + 120px) 32px 160px;
    max-width:680px;
    margin:0 auto;
  }
  #page-about p{
    font-size:clamp(16px, 1.8vw, 20px);
    line-height:2.1;
    font-weight:300;
    letter-spacing:0.01em;
  }
  #page-about .clinks{
    margin-top:48px;
    display:flex; flex-direction:column; gap:14px;
  }
  #page-about .clinks a{
    font-size:14px; text-decoration:none; letter-spacing:0.03em;
    border-bottom:1px solid transparent;
    display:inline-block;
    transition:border-color .25s ease;
  }
  #page-about .clinks a:hover{ border-color:var(--ink); }

  /* ---------- NOTE (blog list) ---------- */
  #page-note .inner{
    padding:calc(var(--nav-h) + 120px) 32px 160px;
    max-width:820px;
    margin:0 auto;
  }
  .post{
    display:grid;
    grid-template-columns:120px 1fr auto;
    gap:28px;
    align-items:baseline;
    padding:26px 0;
    border-bottom:1px solid var(--hairline);
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
  }
  .post .date{ font-size:12px; color:var(--mute); letter-spacing:0.05em; }
  .post .title{ font-size:15px; letter-spacing:0.01em; font-weight:300; transition:opacity .25s ease; }
  .post .arrow{ font-size:13px; opacity:0; transform:translateX(-6px); transition:all .3s ease; }
  .post:hover .title{ opacity:0.5; }
  .post:hover .arrow{ opacity:1; transform:translateX(0); }

  /* ---------- WORK DETAIL (left-aligned, no heading) ---------- */
  .wd-title{
    text-align:center;
    padding:calc(var(--nav-h) + 88px) 32px 48px;
  }
  .wd-title-ja{
    font-size:26px; font-weight:500; letter-spacing:0.03em; margin-bottom:10px;
  }
  .wd-title-en{
    font-size:13px; color:var(--mute); letter-spacing:0.08em;
  }
  .wd-images{
    width:50vw;
    max-width:900px;
    margin:0 auto 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .wd-images img{
    width:100%; height:auto; display:block;
    filter:grayscale(100%) contrast(1.02);
  }
  .wd-desc{
    max-width:640px;
    margin:0 auto;
    padding:0 32px 160px;
    text-align:left;
  }
  .wd-desc .desc-ja{
    font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;
    font-size:15px; line-height:2.1; margin-bottom:22px;
  }
  .wd-desc .desc-en{ font-size:13px; line-height:1.9; color:var(--mute); }

  /* ---------- NOTE DETAIL ---------- */
  .nd-wrap{
    max-width:640px;
    margin:0 auto;
    padding:calc(var(--nav-h) + 88px) 32px 160px;
  }
  .nd-title{ font-size:22px; font-weight:500; margin-bottom:10px; }
  .nd-date{ font-size:12px; color:var(--mute); display:block; margin-bottom:36px; }
  .nd-image{ width:100%; height:auto; margin-bottom:36px; filter:grayscale(100%) contrast(1.02); }
  .nd-body{ font-size:15px; line-height:2; }

  footer{
    height:var(--footer-h);
    display:flex; align-items:center; justify-content:center;
    padding:0 32px;
    text-align:center;
  }
  footer .copy{
    font-size:11px; color:var(--mute); letter-spacing:0.06em;
  }

  @media (max-width:640px){
    header{ padding:0 20px; }
    nav ul{
      position:fixed; top:var(--nav-h); left:0; right:0;
      flex-direction:column; align-items:flex-end;
      background:rgba(17,17,17,0.96);
      padding:22px 24px;
      gap:20px;
      transform:translateY(-120%);
      transition:transform .3s ease;
    }
    nav ul.open{ transform:translateY(0); }
    header{ mix-blend-mode:normal; }
    .menu-toggle{ display:block; }
    .work-item img{ width:70% !important; max-width:100% !important; }
    .works-wrap{ padding:calc(var(--nav-h) + 40px) 6vw 120px; gap:64px; }
    .post{ grid-template-columns:1fr; gap:6px; }
    .wd-images{ width:92vw; }
    .hero-bg-img{ max-width:min(550px, 88vw); max-height:48vh; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <span class="logo" data-action="home"></span>
  <nav>
    <ul>
      <li><a data-link="portfolio">Portfolio</a></li>
      <li><a data-link="works">Works</a></li>
      <li><a data-link="about">About</a></li>
      <li><a data-link="note">Note</a></li>
    </ul>
  </nav>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">&#9776;</button>
</header>

<!-- ============ HOME ============ -->
<section class="page" id="page-home">
  <div class="hero-stage">
    <img class="hero-bg-img" id="heroImg" src="home-slide-1.png" alt="work preview">
    <h1>YOUR NAME</h1>
  </div>
</section>

<!-- ============ PORTFOLIO (password gate + scroll viewer) ============ -->
<section class="page" id="page-portfolio">
  <div id="portfolio-lock">
    <span class="lock-label">Portfolio &mdash; Password Required</span>
    <input type="password" class="lock-input" id="portfolio-pass-input" placeholder="Password" autocomplete="off">
    <button class="lock-btn" id="portfolio-pass-btn">View</button>
    <span class="lock-error" id="portfolio-pass-error"></span>
  </div>
  <div id="portfolio-viewer">
    <span class="pv-close" id="pvClose">Close</span>
    <div id="pv-pages"></div>
  </div>
</section>

<!-- ============ WORKS ============ -->
<section class="page" id="page-works">
  <div class="works-wrap">
    <h2 class="page-heading">Works</h2>
    <div class="works-list" id="worksList"></div>
  </div>
</section>

<!-- ============ WORK DETAIL ============ -->
<section class="page" id="page-work-detail">
  <div class="wd-title">
    <div class="wd-title-ja" id="wd-title-ja"></div>
    <div class="wd-title-en" id="wd-title-en"></div>
  </div>
  <div class="wd-images" id="wd-images"></div>
  <div class="wd-desc">
    <p class="desc-ja" id="wd-desc-ja"></p>
    <p class="desc-en" id="wd-desc-en"></p>
  </div>
</section>

<!-- ============ ABOUT ============ -->
<section class="page" id="page-about">
  <div class="inner">
    <h2 class="page-heading">About</h2>
    <p>写真とデザインを通して、日常の中にある静かな瞬間を残すことを大切にしています。東京を拠点に、編集・空間・プロダクトの領域で活動中です。</p>
    <div class="clinks">
      <a href="mailto:hello@example.com">hello@example.com</a>
      <a href="#" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</section>

<!-- ============ NOTE (blog list) ============ -->
<section class="page" id="page-note">
  <div class="inner">
    <h2 class="page-heading">Note</h2>
    <div id="notesList"></div>
  </div>
</section>

<!-- ============ NOTE DETAIL ============ -->
<section class="page" id="page-note-detail">
  <div class="nd-wrap">
    <div class="nd-title" id="nd-title"></div>
    <span class="nd-date" id="nd-date"></span>
    <img class="nd-image" id="nd-image" src="" alt="">
    <p class="nd-body" id="nd-body"></p>
  </div>
</section>

<footer>
  <div class="copy">&copy; 2026 All rights reserved.</div>
</footer>

  const notesData = [{"id": 1, "title": "撮影の合間に考えていること", "date": "2026.08.20", "image": "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271200%27%20height%3D%27800%27%20viewBox%3D%270%200%201200%20800%27%3E%0A%3Cdefs%3E%0A%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%25%27%20y1%3D%270%25%27%20x2%3D%27100%25%27%20y2%3D%27100%25%27%3E%0A%3Cstop%20offset%3D%270%25%27%20stop-color%3D%27%23d0d0d0%27/%3E%0A%3Cstop%20offset%3D%27100%25%27%20stop-color%3D%27%234a4a4a%27/%3E%0A%3C/linearGradient%3E%0A%3Cfilter%20id%3D%27n%27%3E%0A%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%20result%3D%27noise%27/%3E%0A%3CfeColorMatrix%20in%3D%27noise%27%20type%3D%27matrix%27%20values%3D%270%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200.06%200%27/%3E%0A%3C/filter%3E%0A%3C/defs%3E%0A%3Crect%20width%3D%271200%27%20height%3D%27800%27%20fill%3D%27url%28%23g%29%27/%3E%0A%3Crect%20width%3D%271200%27%20height%3D%27800%27%20filter%3D%27url%28%23n%29%27/%3E%0A%3C/svg%3E", "body": "撮影の合間、ふと手を止めて考えることが増えました。作品にする瞬間よりも、その前後にある余白の時間の方が、実は多くのことを教えてくれる気がしています。今回はそんな合間の時間について、少しだけ書き留めておきます。"}, {"id": 2, "title": "新しいプロジェクトのはじまり", "date": "2026.07.12", "image": "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271200%27%20height%3D%27800%27%20viewBox%3D%270%200%201200%20800%27%3E%0A%3Cdefs%3E%0A%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%25%27%20y1%3D%270%25%27%20x2%3D%27100%25%27%20y2%3D%27100%25%27%3E%0A%3Cstop%20offset%3D%270%25%27%20stop-color%3D%27%23c8c8c8%27/%3E%0A%3Cstop%20offset%3D%27100%25%27%20stop-color%3D%27%233a3a3a%27/%3E%0A%3C/linearGradient%3E%0A%3Cfilter%20id%3D%27n%27%3E%0A%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%20result%3D%27noise%27/%3E%0A%3CfeColorMatrix%20in%3D%27noise%27%20type%3D%27matrix%27%20values%3D%270%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200.06%200%27/%3E%0A%3C/filter%3E%0A%3C/defs%3E%0A%3Crect%20width%3D%271200%27%20height%3D%27800%27%20fill%3D%27url%28%23g%29%27/%3E%0A%3Crect%20width%3D%271200%27%20height%3D%27800%27%20filter%3D%27url%28%23n%29%27/%3E%0A%3C/svg%3E", "body": "新しいプロジェクトがようやく動き出しました。まだ形になっていない部分も多いですが、これまでとは違う視点で被写体と向き合えそうな予感があります。進捗はこのNoteで少しずつ共有していく予定です。"}, {"id": 3, "title": "モノトーンで見せることの意味", "date": "2026.05.03", "image": "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271200%27%20height%3D%27800%27%20viewBox%3D%270%200%201200%20800%27%3E%0A%3Cdefs%3E%0A%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%25%27%20y1%3D%270%25%27%20x2%3D%27100%25%27%20y2%3D%27100%25%27%3E%0A%3Cstop%20offset%3D%270%25%27%20stop-color%3D%27%23dadada%27/%3E%0A%3Cstop%20offset%3D%27100%25%27%20stop-color%3D%27%23585858%27/%3E%0A%3C/linearGradient%3E%0A%3Cfilter%20id%3D%27n%27%3E%0A%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%20result%3D%27noise%27/%3E%0A%3CfeColorMatrix%20in%3D%27noise%27%20type%3D%27matrix%27%20values%3D%270%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200.06%200%27/%3E%0A%3C/filter%3E%0A%3C/defs%3E%0A%3Crect%20width%3D%271200%27%20height%3D%27800%27%20fill%3D%27url%28%23g%29%27/%3E%0A%3Crect%20width%3D%271200%27%20height%3D%27800%27%20filter%3D%27url%28%23n%29%27/%3E%0A%3C/svg%3E", "body": "色を削ぎ落とすことで見えてくるものがあります。モノトーンで見せるという選択は、単なる装飾ではなく、伝えたい部分だけを残すための手段だと考えています。今回はその考え方について整理してみました。"}];
  const PORTFOLIO_PASSWORD = '1234';

  const pages = document.querySelectorAll('.page');
  const navLinks = document.querySelectorAll('[data-link]');
  const logoEl = document.querySelector('.logo');
  const navUl = document.querySelector('nav ul');
  const menuToggle = document.getElementById('menuToggle');
  const headerEl = document.querySelector('header');

  let portfolioUnlocked = false;
  let pdfDoc = null;

  // ---------- core render (no history side-effects) ----------
  function renderPage(type, id){
    const name = document.getElementById('page-' + type) ? type : 'home';
    let navName = name;
    if(name === 'work-detail') navName = 'works';
    if(name === 'note-detail') navName = 'note';

    pages.forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');

    navLinks.forEach(l => l.classList.toggle('current', l.dataset.link === navName));

    if(name === 'home'){
      logoEl.textContent = '';
      logoEl.style.opacity = '0';
      logoEl.style.pointerEvents = 'none';
      document.body.classList.add('no-scroll');
    } else {
      logoEl.textContent = 'Home';
      logoEl.style.opacity = '1';
      logoEl.style.pointerEvents = 'auto';
      document.body.classList.remove('no-scroll');
    }

    if(name === 'portfolio'){
      if(portfolioUnlocked){
        document.getElementById('portfolio-lock').style.display = 'none';
        openViewer();
      } else {
        document.getElementById('portfolio-lock').style.display = 'flex';
        document.getElementById('portfolio-viewer').classList.remove('active');
        headerEl.style.display = '';
      }
    } else {
      document.getElementById('portfolio-viewer').classList.remove('active');
      headerEl.style.display = '';
    }

    if(name === 'work-detail'){
      const w = worksData.find(x => x.id === id);
      if(w){
        document.getElementById('wd-title-ja').textContent = w.titleJa;
        document.getElementById('wd-title-en').textContent = w.titleEn;
        const imgWrap = document.getElementById('wd-images');
        imgWrap.innerHTML = '';
        w.images.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = w.titleJa;
          imgWrap.appendChild(img);
        });
        document.getElementById('wd-desc-ja').textContent = w.descJa;
        document.getElementById('wd-desc-en').textContent = w.descEn;
      }
    }

    if(name === 'note-detail'){
      const n = notesData.find(x => x.id === id);
      if(n){
        document.getElementById('nd-title').textContent = n.title;
        document.getElementById('nd-date').textContent = n.date;
        document.getElementById('nd-image').src = n.image;
        document.getElementById('nd-image').alt = n.title;
        document.getElementById('nd-body').textContent = n.body;
      }
    }

    navUl.classList.remove('open');
    window.scrollTo(0,0);
  }

  // ---------- navigation with real browser history ----------
  function navigateTo(type, id, push){
    if(push === undefined) push = true;
    renderPage(type, id);
    if(push){
      const hash = id ? (type + '-' + id) : type;
      try{
        if(location.hash !== '#' + hash){
          history.pushState({ type: type, id: id || null }, '', '#' + hash);
        }
      } catch(e){
        /* history API unavailable in this preview context - ignore */
      }
    }
  }

  window.addEventListener('popstate', (e) => {
    if(e.state){
      renderPage(e.state.type, e.state.id);
    } else {
      const parsed = parseHash(location.hash.replace('#',''));
      renderPage(parsed.type, parsed.id);
    }
  });

  function parseHash(h){
    if(!h) return { type: 'home', id: null };
    if(h.indexOf('work-') === 0){
      const id = parseInt(h.split('-')[1], 10);
      if(worksData.find(w => w.id === id)) return { type: 'work-detail', id: id };
    }
    if(h.indexOf('note-') === 0){
      const id = parseInt(h.split('-')[1], 10);
      if(notesData.find(n => n.id === id)) return { type: 'note-detail', id: id };
    }
    if(['portfolio','works','about','note'].indexOf(h) !== -1) return { type: h, id: null };
    return { type: 'home', id: null };
  }

  navLinks.forEach(l => {
    l.addEventListener('click', () => navigateTo(l.dataset.link, null));
  });

  document.querySelectorAll('[data-action="home"]').forEach(el => {
    el.addEventListener('click', () => navigateTo('home', null));
  });

  menuToggle.addEventListener('click', () => {
    navUl.classList.toggle('open');
  });

  // ---------- Home hero image (behind title, loops, click to cycle) ----------
  const heroImages = ['home-slide-1.png', 'home-slide-2.png'];
  let heroIndex = 0;
  const heroImg = document.getElementById('heroImg');
  heroImg.addEventListener('click', () => {
    heroImg.classList.add('fading');
    setTimeout(() => {
      heroIndex = (heroIndex + 1) % heroImages.length;
      heroImg.src = heroImages[heroIndex];
      heroImg.classList.remove('fading');
    }, 200);
  });

  // ---------- Portfolio password gate ----------
  function checkPortfolioPassword(){
    const input = document.getElementById('portfolio-pass-input');
    const err = document.getElementById('portfolio-pass-error');
    if(input.value === PORTFOLIO_PASSWORD){
      portfolioUnlocked = true;
      document.getElementById('portfolio-lock').style.display = 'none';
      openViewer();
    } else {
      err.textContent = 'パスワードが違います';
    }
  }
  document.getElementById('portfolio-pass-btn').addEventListener('click', checkPortfolioPassword);
  document.getElementById('portfolio-pass-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPortfolioPassword();
  });

  document.getElementById('pvClose').addEventListener('click', () => {
    portfolioUnlocked = false;
    document.getElementById('portfolio-viewer').classList.remove('active');
    headerEl.style.display = '';
    document.getElementById('portfolio-lock').style.display = 'flex';
    document.getElementById('portfolio-pass-input').value = '';
    document.getElementById('portfolio-pass-error').textContent = '';
  });

  // ---------- PDF viewer (pdf.js, continuous vertical scroll) ----------
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function openViewer(){
    headerEl.style.display = 'none';
    const viewer = document.getElementById('portfolio-viewer');
    viewer.classList.add('active');
    viewer.scrollTop = 0;

    const pagesContainer = document.getElementById('pv-pages');
    if(pagesContainer.children.length > 0){ return; }

    pagesContainer.innerHTML = '<div class="pv-loading">読み込み中...</div>';
    try{
      if(!pdfDoc){
        pdfDoc = await pdfjsLib.getDocument('portfolio.pdf').promise;
      }
      pagesContainer.innerHTML = '';
      const containerWidth = Math.min(window.innerWidth, 1000);
      for(let i = 1; i <= pdfDoc.numPages; i++){
        const page = await pdfDoc.getPage(i);
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = containerWidth / baseViewport.width;
        const viewport = page.getViewport({ scale: scale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        pagesContainer.appendChild(canvas);
      }
    } catch(err){
      console.error('PDF load error', err);
      pagesContainer.innerHTML = '<div class="pv-loading">PDFの読み込みに失敗しました</div>';
    }
  }

  // ---------- Works ----------
  function renderWorksList(){
    const list = document.getElementById('worksList');
    list.innerHTML = '';
    worksData.forEach((w) => {
      const item = document.createElement('div');
      item.className = 'work-item';
      const img = document.createElement('img');
      img.src = w.images[0];
      img.alt = w.titleJa;
      item.appendChild(img);
      item.addEventListener('click', () => navigateTo('work-detail', w.id));
      list.appendChild(item);
    });
  }

  // ---------- Note ----------
  function renderNotesList(){
    const list = document.getElementById('notesList');
    list.innerHTML = '';
    notesData.forEach(n => {
      const a = document.createElement('a');
      a.className = 'post';
      a.href = '#';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'date';
      dateSpan.textContent = n.date;
      const titleSpan = document.createElement('span');
      titleSpan.className = 'title';
      titleSpan.textContent = n.title;
      const arrowSpan = document.createElement('span');
      arrowSpan.className = 'arrow';
      arrowSpan.textContent = '\u2192';
      a.appendChild(dateSpan);
      a.appendChild(titleSpan);
      a.appendChild(arrowSpan);
      a.addEventListener('click', (e) => { e.preventDefault(); navigateTo('note-detail', n.id); });
      list.appendChild(a);
    });
  }

  // ---------- init ----------
  renderWorksList();
  renderNotesList();
  const initial = parseHash(location.hash.replace('#',''));
  renderPage(initial.type, initial.id);
</script>
