<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --mute:#8f8f8f;
    --hairline:#e6e6e6;
    --nav-h:64px;
    --footer-h:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter','Zen Kaku Gothic New', sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  body.no-scroll{ overflow:hidden; height:100vh; }
  ::selection{background:var(--ink); color:var(--paper);}
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- NAV ---------- */
  header{
    position:fixed; top:0; left:0; right:0; height:var(--nav-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px;
    z-index:200;
    mix-blend-mode:difference;
  }
  header, header a{ color:#fff; }
  .logo{
    font-family:'Inter','Zen Kaku Gothic New', sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-decoration:none;
    font-weight:500;
    cursor:pointer;
    text-transform:uppercase;
    transition:opacity .3s ease;
    min-width:10px;
  }
  nav ul{
    list-style:none;
    display:flex;
    gap:32px;
  }
  nav a{
    text-decoration:none;
    color:#fff;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    opacity:0.65;
    transition:opacity .3s ease;
  }
  nav a::after{
    content:'';
    position:absolute; left:0; bottom:0;
    width:0; height:1px;
    background:#fff;
    transition:width .35s ease;
  }
  nav a:hover{ opacity:1; }
  nav a.current{ opacity:1; }
  nav a.current::after{ width:100%; }

  .menu-toggle{
    display:none;
    background:none; border:none; color:#fff;
    font-size:20px; line-height:1; cursor:pointer;
    padding:4px;
  }

  /* ---------- SHARED PAGE HEADING ---------- */
  .page-heading{
    font-size:26px;
    font-weight:500;
    letter-spacing:0.03em;
    margin-bottom:56px;
  }

  /* ---------- PAGE SWITCHING ---------- */
  .page{
    display:none;
    min-height:100vh;
  }
  .page.active{
    display:block;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- HOME (no scroll, fits viewport with footer) ---------- */
  #page-home{
    height:calc(100vh - var(--footer-h));
    min-height:auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    gap:22px;
  }
  #page-home h1{
    font-weight:500;
    font-size:clamp(20px, 4vw, 48px);
    letter-spacing:0.1em;
  }
  .hero-slider{
    width:150px;
    cursor:pointer;
    overflow:hidden;
  }
  .hero-slider img{
    display:block;
    width:100%;
    height:auto;
    filter:grayscale(60%) contrast(1.02);
    transition:opacity .25s ease;
  }
  .hero-slider.fading img{ opacity:0; }

  /* ---------- PORTFOLIO (password gate + fullscreen viewer) ---------- */
  #page-portfolio{
    height:100vh;
    position:relative;
  }
  #portfolio-lock{
    height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    gap:18px;
    padding:0 24px;
  }
  .lock-label{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--mute);
  }
  .lock-input{
    border:none; border-bottom:1px solid var(--ink); background:none;
    text-align:center; font-size:14px; padding:8px 4px; width:200px;
    font-family:inherit; letter-spacing:0.05em; color:var(--ink);
  }
  .lock-input:focus{ outline:none; border-bottom-color:var(--mute); }
  .lock-btn{
    background:none; border:1px solid var(--ink); padding:10px 30px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .lock-btn:hover{ background:var(--ink); color:#fff; }
  .lock-error{ font-size:11px; color:#b23b3b; min-height:14px; }

  #portfolio-viewer{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:50;
  }
  #portfolio-viewer.active{ display:block; }
  #pv-canvas-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #pv-canvas-wrap canvas{
    max-width:100%; max-height:100%;
    display:block;
  }
  .pv-zone{
    position:absolute; top:0; bottom:0; width:50%;
    cursor:pointer;
  }
  .pv-zone-left{ left:0; }
  .pv-zone-right{ right:0; }
  .pv-counter{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:0.1em; color:rgba(255,255,255,0.6);
    pointer-events:none;
  }
  .pv-close{
    position:absolute; top:20px; right:24px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(255,255,255,0.7);
    cursor:pointer;
    z-index:2;
  }
  .pv-close:hover{ color:#fff; }

  /* ---------- WORKS (photo stream, all left-aligned, no captions) ---------- */
  .works-wrap{
    padding:calc(var(--nav-h) + 64px) 8vw 160px;
    max-width:1100px;
    margin:0 auto;
  }
  .works-wrap .page-heading{ margin-bottom:80px; }
  .works-list{
    display:flex;
    flex-direction:column;
    gap:80px;
  }
  .work-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    cursor:pointer;
  }
  .work-item img{
    display:block;
    width:38%;
    min-width:220px;
    max-width:460px;
    height:auto;
    filter:grayscale(100%) contrast(1.02);
    transition:filter .6s ease, opacity .6s ease, transform .5s ease;
  }
  .work-item:hover img{
    filter:grayscale(0%) contrast(1.02);
    transform:translateY(-2px);
  }
  .work-item.size-l img{ width:56%; max-width:640px; }
  .work-item.size-s img{ width:26%; max-width:300px; }

  /* ---------- ABOUT ---------- */
  #page-about .inner{
    padding:calc(var(--nav-h) + 120px) 32px 160px;
    max-width:680px;
    margin:0 auto;
  }
  #page-about p{
    font-size:clamp(16px, 1.8vw, 20px);
    line-height:2.1;
    font-weight:300;
    letter-spacing:0.01em;
  }
  #page-about .clinks{
    margin-top:48px;
    display:flex; flex-direction:column; gap:14px;
  }
  #page-about .clinks a{
    font-size:14px; text-decoration:none; letter-spacing:0.03em;
    border-bottom:1px solid transparent;
    display:inline-block;
    transition:border-color .25s ease;
  }
  #page-about .clinks a:hover{ border-color:var(--ink); }

  /* ---------- NOTE (blog list) ---------- */
  #page-note .inner{
    padding:calc(var(--nav-h) + 120px) 32px 160px;
    max-width:820px;
    margin:0 auto;
  }
  .post{
    display:grid;
    grid-template-columns:120px 1fr auto;
    gap:28px;
    align-items:baseline;
    padding:26px 0;
    border-bottom:1px solid var(--hairline);
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
  }
  .post .date{ font-size:12px; color:var(--mute); letter-spacing:0.05em; }
  .post .title{ font-size:15px; letter-spacing:0.01em; font-weight:300; transition:opacity .25s ease; }
  .post .arrow{ font-size:13px; opacity:0; transform:translateX(-6px); transition:all .3s ease; }
  .post:hover .title{ opacity:0.5; }
  .post:hover .arrow{ opacity:1; transform:translateX(0); }

  /* ---------- WORK DETAIL ---------- */
  .wd-title{
    text-align:center;
    padding:calc(var(--nav-h) + 88px) 32px 48px;
  }
  .wd-title-ja{
    font-size:26px; font-weight:500; letter-spacing:0.03em; margin-bottom:10px;
  }
  .wd-title-en{
    font-size:13px; color:var(--mute); letter-spacing:0.08em;
  }
  .wd-images{
    width:50vw;
    max-width:900px;
    margin:0 auto 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .wd-images img{
    width:100%; height:auto; display:block;
    filter:grayscale(100%) contrast(1.02);
  }
  .wd-desc{
    max-width:640px;
    margin:0 auto;
    padding:0 32px 160px;
    text-align:center;
  }
  .wd-desc .heading-ja{ font-size:16px; font-weight:500; margin-bottom:4px; }
  .wd-desc .heading-en{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--mute); margin-bottom:32px; }
  .wd-desc .desc-ja{ font-size:15px; line-height:2; margin-bottom:22px; }
  .wd-desc .desc-en{ font-size:13px; line-height:1.9; color:var(--mute); }

  /* ---------- NOTE DETAIL ---------- */
  .nd-wrap{
    max-width:640px;
    margin:0 auto;
    padding:calc(var(--nav-h) + 88px) 32px 160px;
  }
  .nd-title{ font-size:22px; font-weight:500; margin-bottom:10px; }
  .nd-date{ font-size:12px; color:var(--mute); display:block; margin-bottom:36px; }
  .nd-image{ width:100%; height:auto; margin-bottom:36px; filter:grayscale(100%) contrast(1.02); }
  .nd-body{ font-size:15px; line-height:2; }

  footer{
    height:var(--footer-h);
    display:flex; align-items:center; justify-content:center;
    padding:0 32px;
    text-align:center;
  }
  footer .copy{
    font-size:11px; color:var(--mute); letter-spacing:0.06em;
  }

  @media (max-width:640px){
    header{ padding:0 20px; }
    nav ul{
      position:fixed; top:var(--nav-h); left:0; right:0;
      flex-direction:column; align-items:flex-end;
      background:rgba(17,17,17,0.96);
      padding:22px 24px;
      gap:20px;
      transform:translateY(-120%);
      transition:transform .3s ease;
    }
    nav ul.open{ transform:translateY(0); }
    header{ mix-blend-mode:normal; }
    .menu-toggle{ display:block; }
    .work-item img{ width:70% !important; max-width:100% !important; }
    .work-item.size-l img{ width:88% !important; }
    .work-item.size-s img{ width:50% !important; }
    .works-wrap{ padding:calc(var(--nav-h) + 40px) 6vw 120px; gap:64px; }
    .post{ grid-template-columns:1fr; gap:6px; }
    .wd-images{ width:92vw; }
    .hero-slider{ width:110px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <span class="logo" data-action="home"></span>
  <nav>
    <ul>
      <li><a data-link="portfolio">Portfolio</a></li>
      <li><a data-link="works">Works</a></li>
      <li><a data-link="about">About</a></li>
      <li><a data-link="note">Note</a></li>
    </ul>
  </nav>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">&#9776;</button>
</header>

<!-- ============ HOME ============ -->
<section class="page" id="page-home">
  <h1>YOUR NAME</h1>
  <div class="hero-slider" id="heroSlider">
    <img id="heroImg" src="home-slide-1.png" alt="work preview">
  </div>
</section>

<!-- ============ PORTFOLIO (password gate + viewer) ============ -->
<section class="page" id="page-portfolio">
  <div id="portfolio-lock">
    <span class="lock-label">Portfolio &mdash; Password Required</span>
    <input type="password" class="lock-input" id="portfolio-pass-input" placeholder="Password" autocomplete="off">
    <button class="lock-btn" id="portfolio-pass-btn">View</button>
    <span class="lock-error" id="portfolio-pass-error"></span>
  </div>
  <div id="portfolio-viewer">
    <span class="pv-close" id="pvClose">Close</span>
    <div id="pv-canvas-wrap"><canvas id="pvCanvas"></canvas></div>
    <div class="pv-zone pv-zone-left" id="pvPrev"></div>
    <div class="pv-zone pv-zone-right" id="pvNext"></div>
    <div class="pv-counter" id="pvCounter"></div>
  </div>
</section>

<!-- ============ WORKS ============ -->
<section class="page" id="page-works">
  <div class="works-wrap">
    <h2 class="page-heading">Works</h2>
    <div class="works-list" id="worksList"></div>
  </div>
</section>

<!-- ============ WORK DETAIL ============ -->
<section class="page" id="page-work-detail">
  <div class="wd-title">
    <div class="wd-title-ja" id="wd-title-ja"></div>
    <div class="wd-title-en" id="wd-title-en"></div>
  </div>
  <div class="wd-images" id="wd-images"></div>
  <div class="wd-desc">
    <div class="heading-ja" id="wd-heading-ja"></div>
    <div class="heading-en" id="wd-heading-en"></div>
    <p class="desc-ja" id="wd-desc-ja"></p>
    <p class="desc-en" id="wd-desc-en"></p>
  </div>
</section>

<!-- ============ ABOUT ============ -->
<section class="page" id="page-about">
  <div class="inner">
    <h2 class="page-heading">About</h2>
    <p>写真とデザインを通して、日常の中にある静かな瞬間を残すことを大切にしています。東京を拠点に、編集・空間・プロダクトの領域で活動中です。</p>
    <div class="clinks">
      <a href="mailto:hello@example.com">hello@example.com</a>
      <a href="#" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</section>

<!-- ============ NOTE (blog list) ============ -->
<section class="page" id="page-note">
  <div class="inner">
    <h2 class="page-heading">Note</h2>
    <div id="notesList"></div>
  </div>
</section>

<!-- ============ NOTE DETAIL ============ -->
<section class="page" id="page-note-detail">
  <div class="nd-wrap">
    <div class="nd-title" id="nd-title"></div>
    <span class="nd-date" id="nd-date"></span>
    <img class="nd-image" id="nd-image" src="" alt="">
    <p class="nd-body" id="nd-body"></p>
  </div>
</section>

<footer>
  <div class="copy">&copy; 2026 All rights reserved.</div>
</footer>

  const PORTFOLIO_PASSWORD = '1234';

  const pages = document.querySelectorAll('.page');
  const navLinks = document.querySelectorAll('[data-link]');
  const logoEl = document.querySelector('.logo');
  const navUl = document.querySelector('nav ul');
  const menuToggle = document.getElementById('menuToggle');

  function showPage(name, navName){
    if(!document.getElementById('page-' + name)) name = 'home';
    if(navName === undefined) navName = name;

    pages.forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');

    navLinks.forEach(l => {
      l.classList.toggle('current', l.dataset.link === navName);
    });

    if(name === 'home'){
      logoEl.textContent = '';
      logoEl.style.opacity = '0';
      logoEl.style.pointerEvents = 'none';
      document.body.classList.add('no-scroll');
    } else {
      logoEl.textContent = 'Home';
      logoEl.style.opacity = '1';
      logoEl.style.pointerEvents = 'auto';
      document.body.classList.remove('no-scroll');
    }

    if(name === 'portfolio'){
      if(portfolioUnlocked){
        document.getElementById('portfolio-lock').style.display = 'none';
        openViewer();
      } else {
        document.getElementById('portfolio-lock').style.display = 'flex';
        document.getElementById('portfolio-viewer').classList.remove('active');
      }
    } else {
      document.getElementById('portfolio-viewer').classList.remove('active');
    }

    navUl.classList.remove('open');
    window.scrollTo(0,0);
  }

  navLinks.forEach(l => {
    l.addEventListener('click', () => showPage(l.dataset.link));
  });

  document.querySelectorAll('[data-action="home"]').forEach(el => {
    el.addEventListener('click', () => showPage('home'));
  });

  menuToggle.addEventListener('click', () => {
    navUl.classList.toggle('open');
  });

  // ---------- Home hero slider (loops, uses uploaded images) ----------
  const heroImages = ['home-slide-1.png', 'home-slide-2.png'];
  let heroIndex = 0;
  const heroSlider = document.getElementById('heroSlider');
  const heroImg = document.getElementById('heroImg');
  heroSlider.addEventListener('click', () => {
    heroSlider.classList.add('fading');
    setTimeout(() => {
      heroIndex = (heroIndex + 1) % heroImages.length;
      heroImg.src = heroImages[heroIndex];
      heroSlider.classList.remove('fading');
    }, 200);
  });

  // ---------- Portfolio password gate ----------
  let portfolioUnlocked = false;

  function checkPortfolioPassword(){
    const input = document.getElementById('portfolio-pass-input');
    const err = document.getElementById('portfolio-pass-error');
    if(input.value === PORTFOLIO_PASSWORD){
      portfolioUnlocked = true;
      document.getElementById('portfolio-lock').style.display = 'none';
      openViewer();
    } else {
      err.textContent = 'パスワードが違います';
    }
  }
  document.getElementById('portfolio-pass-btn').addEventListener('click', checkPortfolioPassword);
  document.getElementById('portfolio-pass-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPortfolioPassword();
  });

  // ---------- PDF viewer (pdf.js) ----------
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let pdfDoc = null;
  let pdfPageNum = 1;
  let pdfPageCount = 0;
  let pdfLoading = false;

  function openViewer(){
    document.getElementById('portfolio-viewer').classList.add('active');
    if(!pdfDoc && !pdfLoading){
      pdfLoading = true;
      pdfjsLib.getDocument('portfolio.pdf').promise.then(doc => {
        pdfDoc = doc;
        pdfPageCount = doc.numPages;
        pdfPageNum = 1;
        pdfLoading = false;
        renderPdfPage(pdfPageNum);
      }).catch(err => {
        pdfLoading = false;
        console.error('PDF load error', err);
      });
    } else if(pdfDoc){
      renderPdfPage(pdfPageNum);
    }
  }

  function renderPdfPage(num){
    if(!pdfDoc) return;
    pdfDoc.getPage(num).then(page => {
      const canvas = document.getElementById('pvCanvas');
      const ctx = canvas.getContext('2d');
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = Math.min(
        window.innerWidth / baseViewport.width,
        window.innerHeight / baseViewport.height
      );
      const viewport = page.getViewport({ scale: scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      page.render({ canvasContext: ctx, viewport: viewport });
      document.getElementById('pvCounter').textContent = num + ' / ' + pdfPageCount;
    });
  }

  document.getElementById('pvPrev').addEventListener('click', () => {
    if(pdfPageNum > 1){
      pdfPageNum -= 1;
      renderPdfPage(pdfPageNum);
    }
  });
  document.getElementById('pvNext').addEventListener('click', () => {
    if(pdfPageNum < pdfPageCount){
      pdfPageNum += 1;
      renderPdfPage(pdfPageNum);
    }
  });
  document.getElementById('pvClose').addEventListener('click', () => {
    showPage('home');
  });
  window.addEventListener('resize', () => {
    if(pdfDoc && document.getElementById('portfolio-viewer').classList.contains('active')){
      renderPdfPage(pdfPageNum);
    }
  });

  // ---------- Works ----------
  function renderWorksList(){
    const list = document.getElementById('worksList');
    list.innerHTML = '';
    worksData.forEach((w, idx) => {
      const sizeClass = (idx % 3 === 1) ? ' size-l' : (idx % 3 === 2) ? ' size-s' : '';
      const item = document.createElement('div');
      item.className = 'work-item' + sizeClass;
      const img = document.createElement('img');
      img.src = w.images[0];
      img.alt = w.titleJa;
      item.appendChild(img);
      item.addEventListener('click', () => showWorkDetail(w.id));
      list.appendChild(item);
    });
  }

  function showWorkDetail(id){
    const w = worksData.find(x => x.id === id);
    if(!w) return;
    document.getElementById('wd-title-ja').textContent = w.titleJa;
    document.getElementById('wd-title-en').textContent = w.titleEn;
    const imgWrap = document.getElementById('wd-images');
    imgWrap.innerHTML = '';
    w.images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = w.titleJa;
      imgWrap.appendChild(img);
    });
    document.getElementById('wd-heading-ja').textContent = w.headingJa;
    document.getElementById('wd-heading-en').textContent = w.headingEn;
    document.getElementById('wd-desc-ja').textContent = w.descJa;
    document.getElementById('wd-desc-en').textContent = w.descEn;
    showPage('work-detail', 'works');
  }

  // ---------- Note ----------
  function renderNotesList(){
    const list = document.getElementById('notesList');
    list.innerHTML = '';
    notesData.forEach(n => {
      const a = document.createElement('a');
      a.className = 'post';
      a.href = '#';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'date';
      dateSpan.textContent = n.date;
      const titleSpan = document.createElement('span');
      titleSpan.className = 'title';
      titleSpan.textContent = n.title;
      const arrowSpan = document.createElement('span');
      arrowSpan.className = 'arrow';
      arrowSpan.textContent = '\u2192';
      a.appendChild(dateSpan);
      a.appendChild(titleSpan);
      a.appendChild(arrowSpan);
      a.addEventListener('click', (e) => { e.preventDefault(); showNoteDetail(n.id); });
      list.appendChild(a);
    });
  }

  function showNoteDetail(id){
    const n = notesData.find(x => x.id === id);
    if(!n) return;
    document.getElementById('nd-title').textContent = n.title;
    document.getElementById('nd-date').textContent = n.date;
    document.getElementById('nd-image').src = n.image;
    document.getElementById('nd-image').alt = n.title;
    document.getElementById('nd-body').textContent = n.body;
    showPage('note-detail', 'note');
  }

  // ---------- init ----------
  renderWorksList();
  renderNotesList();
  showPage('home');
</script>

</body>
</html>
