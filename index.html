<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@100..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --mute:#8f8f8f;
    --hairline:#e6e6e6;
    --nav-h:64px;
    --footer-h:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:auto;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter','Zen Kaku Gothic New', sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  body.no-scroll{ overflow:hidden; height:100vh; }
  ::selection{background:var(--ink); color:var(--paper);}
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- NAV (desktop) ---------- */
  header{
    position:fixed; top:0; left:0; right:0; height:var(--nav-h);
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 32px;
    z-index:300;
    mix-blend-mode:difference;
  }
  header a{ color:#fff; }
  .nav-desktop ul{
    list-style:none;
    display:flex;
    gap:32px;
  }
  .nav-desktop a{
    text-decoration:none;
    color:#fff;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:4px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    opacity:0.65;
    transition:opacity .3s ease;
  }
  .nav-desktop a::after{
    content:'';
    position:absolute; left:0; bottom:0;
    width:0; height:1px;
    background:#fff;
    transition:width .35s ease;
  }
  .nav-desktop a:hover{ opacity:1; }
  .nav-desktop a.current{ opacity:1; }
  .nav-desktop a.current::after{ width:100%; }

  /* ---------- HAMBURGER (mobile only, black) ---------- */
  .menu-toggle{
    display:none;
    position:relative;
    width:26px; height:16px;
    background:none; border:none; cursor:pointer; padding:0;
    z-index:310;
  }
  .menu-toggle .bar{
    position:absolute; left:0; width:100%; height:2px;
    background:#000;
    transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .25s ease, top .35s cubic-bezier(.4,0,.2,1);
  }
  .menu-toggle .bar1{ top:0; }
  .menu-toggle .bar2{ top:7px; }
  .menu-toggle .bar3{ top:14px; }
  .menu-toggle.open .bar1{ top:7px; transform:rotate(45deg); }
  .menu-toggle.open .bar2{ opacity:0; }
  .menu-toggle.open .bar3{ top:7px; transform:rotate(-45deg); }

  /* ---------- MOBILE FULL-SCREEN MENU (does not exist in DOM flow until opened) ---------- */
  .mobile-menu{
    display:none;
    position:fixed; inset:0;
    background:#fff;
    z-index:250;
    align-items:center;
    justify-content:center;
  }
  .mobile-menu.open{ display:flex; }
  .mobile-menu ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
  }
  .mobile-menu li{
    opacity:0;
    transform:translateY(18px);
  }
  .mobile-menu.open li{
    animation:menuItemIn .55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .mobile-menu.open li:nth-child(1){ animation-delay:.08s; }
  .mobile-menu.open li:nth-child(2){ animation-delay:.15s; }
  .mobile-menu.open li:nth-child(3){ animation-delay:.22s; }
  .mobile-menu.open li:nth-child(4){ animation-delay:.29s; }
  .mobile-menu.open li:nth-child(5){ animation-delay:.36s; }
  @keyframes menuItemIn{
    to{ opacity:1; transform:translateY(0); }
  }
  .mobile-menu a{
    text-decoration:none;
    color:var(--ink);
    font-size:22px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:400;
  }
  .mobile-menu a.current{ color:var(--mute); }

  /* ---------- SHARED PAGE HEADING ---------- */
  .page-heading{
    font-size:26px;
    font-weight:500;
    letter-spacing:0.03em;
    margin-bottom:56px;
  }

  /* ---------- PAGE SWITCHING ---------- */
  .page{
    display:none;
    min-height:100vh;
  }
  .page.active{
    display:block;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- HOME (no scroll, image directly behind text, no white box) ---------- */
  #page-home{
    height:calc(100vh - var(--footer-h));
    min-height:auto;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
  }
  #page-home.active{
    display:flex;
  }
  .hero-stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hero-bg-img{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    max-width:min(750px, 70vw);
    max-height:55vh;
    width:auto; height:auto;
    cursor:pointer;
    filter:grayscale(15%) contrast(1.02);
    transition:opacity .25s ease;
    z-index:1;
  }
  .hero-bg-img.fading{ opacity:0; }
  #page-home h1{
    position:relative;
    z-index:2;
    font-weight:500;
    font-size:clamp(20px, 4vw, 48px);
    letter-spacing:0.1em;
  }

  /* ---------- PORTFOLIO (password gate + scrollable viewer) ---------- */
  #page-portfolio{
    height:100vh;
    position:relative;
  }
  #portfolio-lock{
    height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    gap:18px;
    padding:0 24px;
  }
  .lock-label{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--mute);
  }
  .lock-input{
    border:none; border-bottom:1px solid var(--ink); background:none;
    text-align:center; font-size:14px; padding:8px 4px; width:200px;
    font-family:inherit; letter-spacing:0.05em; color:var(--ink);
  }
  .lock-input:focus{ outline:none; border-bottom-color:var(--mute); }
  .lock-btn{
    background:none; border:1px solid var(--ink); padding:10px 30px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .lock-btn:hover{ background:var(--ink); color:#fff; }
  .lock-error{ font-size:11px; color:#b23b3b; min-height:14px; }

  #portfolio-viewer{
    display:none;
    position:fixed;
    inset:0;
    background:#525659;
    z-index:280;
  }
  #portfolio-viewer.active{ display:block; }
  #pvFrame{
    display:none;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
  }
  #pv-scroll{
    display:none;
    position:absolute;
    inset:0;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }
  #pv-pages{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    padding:70px 0 60px;
  }
  .pv-page-slot{
    width:100%;
    margin-bottom:2px;
    background:#3d3f41;
  }
  .pv-page-slot canvas{
    display:block;
    width:100%;
    height:100%;
  }
  .pv-loading{
    color:rgba(255,255,255,0.7);
    font-size:11px;
    letter-spacing:0.1em;
    text-align:center;
    padding-top:120px;
  }
  .pv-close{
    position:fixed; top:20px; right:24px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(255,255,255,0.85);
    cursor:pointer;
    z-index:295;
    background:rgba(0,0,0,0.45);
    padding:8px 14px;
  }
  .pv-close:hover{ color:#fff; }

  /* ---------- WORKS ---------- */
  .works-wrap{
    padding:calc(var(--nav-h) + 64px) 8vw 160px;
    max-width:1100px;
    margin:0 auto;
  }
  .works-wrap .page-heading{ margin-bottom:80px; }
  .works-list{
    display:flex;
    flex-direction:column;
    gap:80px;
  }
  .work-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    cursor:pointer;
  }
  .work-item img{
    display:block;
    width:100%;
    max-width:min(750px, 70vw);
    height:auto;
    transition:opacity .4s ease, transform .5s ease;
  }
  .work-item:hover img{
    transform:translateY(-2px);
  }

  /* ---------- ABOUT ---------- */
  #page-about .inner{
    padding:calc(var(--nav-h) + 120px) 8vw 160px;
    max-width:680px;
    margin:0;
  }
  #page-about p{
    font-family:'Noto Sans JP', sans-serif;
    font-size:14px;
    line-height:1.4;
    font-weight:300;
    letter-spacing:0.01em;
  }
  #page-about .clinks{
    margin-top:48px;
    display:flex; flex-direction:column; gap:14px;
  }
  #page-about .clinks a{
    font-size:14px; text-decoration:none; letter-spacing:0.03em;
    border-bottom:1px solid transparent;
    display:inline-block;
    transition:border-color .25s ease;
  }
  #page-about .clinks a:hover{ border-color:var(--ink); }

  /* ---------- NOTE (blog list) ---------- */
  #page-note .inner{
    padding:calc(var(--nav-h) + 120px) 8vw 160px;
    max-width:820px;
    margin:0;
  }
  .post{
    display:grid;
    grid-template-columns:120px 1fr auto;
    gap:28px;
    align-items:baseline;
    padding:13px 0;
    border-bottom:1px solid var(--hairline);
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
  }
  .post .date{ font-size:13px; color:var(--mute); letter-spacing:0.05em; }
  .post .title{
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    letter-spacing:0.01em;
    font-weight:300;
    transition:opacity .25s ease;
  }
  .post .arrow{ font-size:13px; opacity:0; transform:translateX(-6px); transition:all .3s ease; }
  .post:hover .title{ opacity:0.5; }
  .post:hover .arrow{ opacity:1; transform:translateX(0); }

  /* ---------- WORK DETAIL ----------
     text left-aligned, left edge matches image container's left edge,
     Japanese title/body set in Noto Sans JP (title: weight 350 "demi-light",
     body: weight 300 "light"), same font-size for both per spec. */
  .wd-title{
    text-align:center;
    padding:calc(var(--nav-h) + 88px) 32px 48px;
  }
  .wd-title-ja{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:350;
    font-size:15px;
    letter-spacing:0.03em;
    margin-bottom:10px;
  }
  .wd-title-en{
    font-size:13px; color:var(--mute); letter-spacing:0.08em;
  }
  .wd-images{
    width:50vw;
    max-width:900px;
    margin:0 auto 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .wd-images img{
    width:100%; height:auto; display:block;
  }
  .wd-desc{
    width:50vw;
    max-width:900px;
    margin:0 auto;
    padding:0 18% 64px 0;
    text-align:left;
  }
  .wd-desc .desc-ja{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:300;
    font-size:13px;
    line-height:2.1;
    margin-bottom:11px;
    white-space:pre-line;
  }
  .wd-desc .desc-en{ font-size:13px; line-height:1.9; color:var(--mute); white-space:pre-line; }

  .wd-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:36px;
    padding:24px 0 140px;
  }
  .wd-nav-btn{
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    opacity:0.6;
    transition:opacity .25s ease;
  }
  .wd-nav-btn:hover{ opacity:1; }
  .wd-nav-index{ font-size:18px; }

  /* ---------- NOTE DETAIL ---------- */
  .nd-wrap{
    max-width:640px;
    margin:0 auto;
    padding:calc(var(--nav-h) + 88px) 32px 160px;
  }
  .nd-title{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:350;
    font-size:15px;
    letter-spacing:0.03em;
    margin-bottom:10px;
  }
  .nd-date{ font-size:13px; color:var(--mute); letter-spacing:0.08em; display:block; margin-bottom:36px; }
  .nd-image{ width:100%; height:auto; margin-bottom:36px; }
  .nd-body{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:300;
    font-size:13px;
    line-height:2.1;
    white-space:pre-line;
  }

  footer{
    height:var(--footer-h);
    display:flex; align-items:center; justify-content:center;
    padding:0 32px;
    text-align:center;
  }
  footer .copy{
    font-size:11px; color:var(--mute); letter-spacing:0.06em;
  }

  @media (max-width:640px){
    header{ padding:0 20px; mix-blend-mode:normal; }
    .nav-desktop{ display:none; }
    .menu-toggle{ display:block; }
    .work-item img{ max-width:min(550px, 88vw) !important; }
    .works-wrap{ padding:calc(var(--nav-h) + 40px) 6vw 120px; gap:64px; }
    .post{ grid-template-columns:1fr; gap:6px; }
    .wd-images{ width:92vw; }
    .wd-desc{ width:92vw; padding:0 0 40px 0; }
    .hero-bg-img{ max-width:min(550px, 88vw); max-height:48vh; }
  }
  @media (min-width:641px){
    .mobile-menu{ display:none !important; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

<script>
  const worksData = [{"id": 1, "titleJa": "格子のすきま", "titleEn": "Lattice Dwelling", "images": ["lattice-dwelling-slide-1.jpg", "lattice-dwelling-slide-2.jpg", "lattice-dwelling-slide-3.jpg", "lattice-dwelling-slide-4.jpg", "lattice-dwelling-slide-5.jpg"], "descJa": "学生寮の設計課題。様々な国籍を持つ学生が共同生活を行うことが想定されている。各住民の住戸を平面を2,600×2,600mmの正方形グリッド2つ分とし、それを建築全体のモジュールに用いた。\n\nこれにより、各フロアの諸機能はすべてグリッドごとに割り当てられる。\n\n一方で、明快なグリッドはコモンからプライベートへと機能のグラデーションを生む。フロア中央の共用部から最も遠い先に住戸ブロックの寝室が位置することで、住民のプライバシーを確保しつつ、状況に応じて使用場所を選択できる。これは、様々な背景を持つ学生どうしが共同生活をする上で自然と交流を深めるためにはたらく。", "descEn": "This project involves the design of a student dormitory intended for communal living among students of diverse nationalities. Each resident's living unit is based on a footprint of two 2,600 x 2,600 mm square grid modules, a unit size that serves as the modular basis for the entire building.\n\nConsequently, the various functions on each floor are allocated according to this grid system.\n\nAt the same time, this clear grid structure creates a functional gradation ranging from communal to private areas. By positioning the sleeping quarters of the living units at the furthest point from the central shared space, the design ensures resident privacy while allowing individuals to choose where to spend their time based on the situation. This arrangement naturally fosters deeper interaction among students from diverse backgrounds as they share their daily lives.", "thumbnail": "lattice-dwelling-thumbnail.jpg"}, {"id": 2, "titleJa": "境界の作法", "titleEn": "Baundary Manners", "images": ["baundary-manners-slide-1.png", "baundary-manners-slide-2.jpg", "baundary-manners-slide-3.png", "baundary-manners-slide-4.jpg", "baundary-manners-slide-5.png", "baundary-manners-slide-6.png"], "descJa": "ブックカフェ併設のオフィスビルの設計課題。本の街、神保町の中心に位置し、出版やメディア関連の企業のテナントの設置が想定されている。\n\nこの作品は、私有されて立ち入れない空間と、消費のための空間で満ちている日本の都市空間に対して、建築のファサードという境界に中間領域を設けることで、新たな都市体験と都市風景をもたらすことを目指している。\n\nオフィスの直通階段を拡大して半屋外空間である立体広場を作り、一般にも開放する。ブックカフェを利用している利用客と、オフィスワーカーが憩える場になり、それらが新たな都市の表情を作り出す。", "descEn": "This project involves the design of an office building featuring an integrated book café. Located in the heart of Jimbocho—a district renowned for its concentration of bookstores—the building is envisioned to house tenants from the publishing and media sectors.\n\nIn response to Japanese urban environments dominated by inaccessible private spaces and areas dedicated solely to consumption, this project aims to create new urban experiences and landscapes by introducing an intermediate zone at the architectural boundary—specifically, the façade.\n\nBy enlarging the office's direct staircases, a semi-outdoor, multi-level plaza is created and opened to the general public. This space serves as a place of relaxation for both book café patrons and office workers, collectively generating a new face for the city.", "thumbnail": "baundary-manners-thumbnail.png"}];
  const notesData = [{"id": 1, "title": "ウェブサイトを開設しました", "date": "2026.08.31", "image": "note-1-slide-1.jpeg", "body": "ウェブサイトを開設しました。設計作品、諸々のプロジェクトなどについて随時更新します。"}];
  const PORTFOLIO_PASSWORD = '1234';

  const pages = document.querySelectorAll('.page');
  const navLinks = document.querySelectorAll('[data-link]');
  const mobileMenu = document.getElementById('mobileMenu');
  const menuToggle = document.getElementById('menuToggle');
  const headerEl = document.querySelector('header');

  let portfolioUnlocked = false;

  function closeMobileMenu(){
    mobileMenu.classList.remove('open');
    menuToggle.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }

  menuToggle.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    menuToggle.classList.toggle('open', isOpen);
    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  // ---------- core render (no history side-effects) ----------
  function renderPage(type, id){
    // Reset scroll position instantly, before swapping page content, so the
    // browser never has to reconcile an out-of-range scroll offset against
    // the outgoing page's collapsing height (which could momentarily reveal
    // the previous page's content).
    window.scrollTo(0, 0);

    const name = document.getElementById('page-' + type) ? type : 'home';
    let navName = name;
    if(name === 'work-detail') navName = 'works';
    if(name === 'note-detail') navName = 'note';

    pages.forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');

    navLinks.forEach(l => l.classList.toggle('current', l.dataset.link === navName));

    if(name === 'home'){
      document.body.classList.add('no-scroll');
    } else {
      document.body.classList.remove('no-scroll');
    }

    if(name === 'portfolio'){
      if(portfolioUnlocked){
        document.getElementById('portfolio-lock').style.display = 'none';
        openViewer();
      } else {
        document.getElementById('portfolio-lock').style.display = 'flex';
        document.getElementById('portfolio-viewer').classList.remove('active');
        headerEl.style.display = '';
      }
    } else {
      document.getElementById('portfolio-viewer').classList.remove('active');
      headerEl.style.display = '';
    }

    if(name === 'work-detail'){
      const w = worksData.find(x => x.id === id);
      if(w){
        document.getElementById('wd-title-ja').textContent = w.titleJa;
        document.getElementById('wd-title-en').textContent = w.titleEn;
        const imgWrap = document.getElementById('wd-images');
        imgWrap.innerHTML = '';
        w.images.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = w.titleJa;
          imgWrap.appendChild(img);
        });
        document.getElementById('wd-desc-ja').textContent = w.descJa;
        document.getElementById('wd-desc-en').textContent = w.descEn;

        const idx = worksData.findIndex(x => x.id === id);
        const prevWork = worksData[(idx - 1 + worksData.length) % worksData.length];
        const nextWork = worksData[(idx + 1) % worksData.length];
        document.getElementById('wdPrev').onclick = () => navigateTo('work-detail', prevWork.id);
        document.getElementById('wdNext').onclick = () => navigateTo('work-detail', nextWork.id);
        document.getElementById('wdIndex').onclick = () => navigateTo('works', null);
      }
    }

    if(name === 'note-detail'){
      const n = notesData.find(x => x.id === id);
      if(n){
        document.getElementById('nd-title').textContent = n.title;
        document.getElementById('nd-date').textContent = n.date;
        document.getElementById('nd-image').src = n.image;
        document.getElementById('nd-image').alt = n.title;
        document.getElementById('nd-body').textContent = n.body;
      }
    }

    closeMobileMenu();
  }

  // ---------- navigation with real browser history ----------
  function navigateTo(type, id, push){
    if(push === undefined) push = true;
    renderPage(type, id);
    if(push){
      const hash = id ? (type + '-' + id) : type;
      try{
        if(location.hash !== '#' + hash){
          history.pushState({ type: type, id: id || null }, '', '#' + hash);
        }
      } catch(e){
        /* history API unavailable in this preview context - ignore */
      }
    }
  }

  window.addEventListener('popstate', (e) => {
    if(e.state){
      renderPage(e.state.type, e.state.id);
    } else {
      const parsed = parseHash(location.hash.replace('#',''));
      renderPage(parsed.type, parsed.id);
    }
  });

  function parseHash(h){
    if(!h) return { type: 'home', id: null };
    if(h.indexOf('work-') === 0){
      const id = parseInt(h.split('-')[1], 10);
      if(worksData.find(w => w.id === id)) return { type: 'work-detail', id: id };
    }
    if(h.indexOf('note-') === 0){
      const id = parseInt(h.split('-')[1], 10);
      if(notesData.find(n => n.id === id)) return { type: 'note-detail', id: id };
    }
    if(['home','portfolio','works','about','note'].indexOf(h) !== -1) return { type: h, id: null };
    return { type: 'home', id: null };
  }

  navLinks.forEach(l => {
    l.addEventListener('click', () => navigateTo(l.dataset.link, null));
  });

  // ---------- core site init (deliberately independent of the PDF viewer
  // below) -- if the third-party pdf.js library fails to load for any
  // reason, the rest of the site must keep working normally. ----------
  renderWorksList();
  renderNotesList();
  const initial = parseHash(location.hash.replace('#',''));
  renderPage(initial.type, initial.id);

  // ---------- Home hero image (behind title, no background box, loops) ----------
  const heroImages = ['home-slide-1.png', 'home-slide-2.png'];
  let heroIndex = 0;
  const heroImg = document.getElementById('heroImg');
  heroImg.addEventListener('click', () => {
    heroImg.classList.add('fading');
    setTimeout(() => {
      heroIndex = (heroIndex + 1) % heroImages.length;
      heroImg.src = heroImages[heroIndex];
      heroImg.classList.remove('fading');
    }, 200);
  });

  // ---------- Portfolio password gate ----------
  function checkPortfolioPassword(){
    const input = document.getElementById('portfolio-pass-input');
    const err = document.getElementById('portfolio-pass-error');
    if(input.value === PORTFOLIO_PASSWORD){
      portfolioUnlocked = true;
      document.getElementById('portfolio-lock').style.display = 'none';
      openViewer();
    } else {
      err.textContent = 'パスワードが違います';
    }
  }
  document.getElementById('portfolio-pass-btn').addEventListener('click', checkPortfolioPassword);
  document.getElementById('portfolio-pass-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPortfolioPassword();
  });

  document.getElementById('pvClose').addEventListener('click', () => {
    portfolioUnlocked = false;
    document.getElementById('portfolio-viewer').classList.remove('active');
    document.getElementById('pvFrame').style.display = 'none';
    document.getElementById('pvFrame').src = '';
    document.getElementById('pv-scroll').style.display = 'none';
    headerEl.style.display = '';
    document.getElementById('portfolio-lock').style.display = 'flex';
    document.getElementById('portfolio-pass-input').value = '';
    document.getElementById('portfolio-pass-error').textContent = '';
  });

  // ---------- PDF viewer ----------
  // Desktop: native browser PDF viewer via iframe (full quality, built-in zoom/scroll).
  // Mobile: pdf.js canvas renderer, one high-resolution canvas per page, lazily
  // rendered as the user scrolls near it. Zooming is left entirely to the
  // browser's own native pinch-zoom (no custom transform/touch handling) --
  // a hand-rolled pinch implementation was causing the content to slide/jump,
  // and native zoom is both smoother and keeps the fixed Close button in place
  // on current mobile browsers.
  // Guarded: if the pdf.js CDN script failed to load for any reason (network
  // issue, ad-blocker, offline), this must NOT throw and take down the rest
  // of the page's JavaScript.
  if(typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  let pdfDoc = null;

  function isMobileViewer(){
    return window.matchMedia('(max-width:640px)').matches;
  }

  async function openViewer(){
    headerEl.style.display = 'none';
    const viewer = document.getElementById('portfolio-viewer');
    viewer.classList.add('active');

    if(isMobileViewer()){
      document.getElementById('pvFrame').style.display = 'none';
      document.getElementById('pv-scroll').style.display = 'block';
      document.getElementById('pv-scroll').scrollTop = 0;
      await renderCanvasPages();
    } else {
      document.getElementById('pv-scroll').style.display = 'none';
      const frame = document.getElementById('pvFrame');
      frame.style.display = 'block';
      if(!frame.src){
        frame.src = 'portfolio.pdf';
      }
    }
  }

  // Renders pages at a much higher pixel density than the screen needs at
  // rest, so that native pinch-zoom (a few times larger) still looks sharp
  // instead of pixelating. Pages are only actually rasterized once they
  // scroll near the viewport, so this stays fast even at high resolution.
  const PV_QUALITY_MULTIPLIER = 2.5;

  async function renderCanvasPages(){
    const pagesContainer = document.getElementById('pv-pages');
    if(pagesContainer.dataset.built === '1'){ return; }

    pagesContainer.innerHTML = '<div class="pv-loading">読み込み中...</div>';
    try{
      if(!pdfDoc){
        pdfDoc = await pdfjsLib.getDocument('portfolio.pdf').promise;
      }
      pagesContainer.innerHTML = '';
      pagesContainer.dataset.built = '1';

      const scrollEl = document.getElementById('pv-scroll');
      const containerWidth = scrollEl.clientWidth;
      const dpr = window.devicePixelRatio || 1;

      const slots = [];
      for(let i = 1; i <= pdfDoc.numPages; i++){
        const page = await pdfDoc.getPage(i);
        const baseViewport = page.getViewport({ scale: 1 });
        const slot = document.createElement('div');
        slot.className = 'pv-page-slot';
        slot.style.height = (containerWidth * baseViewport.height / baseViewport.width) + 'px';
        slot.dataset.rendered = '0';
        pagesContainer.appendChild(slot);
        slots.push({ el: slot, page, baseViewport });
      }

      async function renderSlot(slot, page, baseViewport){
        if(slot.dataset.rendered === '1'){ return; }
        slot.dataset.rendered = '1';
        const fitScale = containerWidth / baseViewport.width;
        const renderScale = fitScale * dpr * PV_QUALITY_MULTIPLIER;
        const viewport = page.getViewport({ scale: renderScale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        slot.innerHTML = '';
        slot.appendChild(canvas);
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            const idx = slots.findIndex(s => s.el === entry.target);
            if(idx !== -1){
              renderSlot(slots[idx].el, slots[idx].page, slots[idx].baseViewport);
            }
          }
        });
      }, { root: scrollEl, rootMargin: '800px 0px', threshold: 0.01 });

      slots.forEach(s => observer.observe(s.el));
    } catch(err){
      console.error('PDF load error', err);
      pagesContainer.innerHTML = '<div class="pv-loading">PDFの読み込みに失敗しました</div>';
    }
  }

  // ---------- Works ----------
  function renderWorksList(){
    const list = document.getElementById('worksList');
    list.innerHTML = '';
    worksData.forEach((w) => {
      const item = document.createElement('div');
      item.className = 'work-item';
      const img = document.createElement('img');
      img.src = w.thumbnail || w.images[0];
      img.alt = w.titleJa;
      item.appendChild(img);
      item.addEventListener('click', () => navigateTo('work-detail', w.id));
      list.appendChild(item);
    });
  }

  // ---------- Note ----------
  function renderNotesList(){
    const list = document.getElementById('notesList');
    list.innerHTML = '';
    notesData.forEach(n => {
      const a = document.createElement('a');
      a.className = 'post';
      a.href = '#';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'date';
      dateSpan.textContent = n.date;
      const titleSpan = document.createElement('span');
      titleSpan.className = 'title';
      titleSpan.textContent = n.title;
      const arrowSpan = document.createElement('span');
      arrowSpan.className = 'arrow';
      arrowSpan.textContent = '\u2192';
      a.appendChild(dateSpan);
      a.appendChild(titleSpan);
      a.appendChild(arrowSpan);
      a.addEventListener('click', (e) => { e.preventDefault(); navigateTo('note-detail', n.id); });
      list.appendChild(a);
    });
  }
</script>

</body>
</html>
